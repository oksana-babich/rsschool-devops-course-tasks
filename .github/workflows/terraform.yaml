name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - task_2

  pull_request:
    branches:
      - main
env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  terraform-check:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.1"

      - name: Terraform fmt check
        run: terraform fmt -check

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars file
        run: |
          cat << EOF > terraform.tfvars
          bucket_name = "${{ secrets.BUCKET_NAME }}"
          client_id_list = ${{ secrets.CLIENT_ID_LIST }}
          thumbprint_list = ${{ secrets.THUMBPRINT_LIST }}
          github_actions_role_name = "${{ secrets.ACTIONS_ROLE_NAME }}"
          oidc_provider_url = "${{ secrets.OIDC_PROVIDER_URL }}"
          github_actions_condition = "${{ secrets.ACTIONS_CONDITION }}"
          iam_policies = ${{ secrets.IAM_POLICIES }}
          key_name = ${{ secrets.KEY_NAME }}
          EOF

      - name: Terraform Init
        run:  terraform init

      - name: Terraform Plan
        run:  terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Create tfvars file
        run: |
          cat << EOF > terraform.tfvars
          bucket_name = "${{ secrets.BUCKET_NAME }}"
          client_id_list = ${{ secrets.CLIENT_ID_LIST }}
          thumbprint_list = ${{ secrets.THUMBPRINT_LIST }}
          github_actions_role_name = "${{ secrets.ACTIONS_ROLE_NAME }}"
          oidc_provider_url = "${{ secrets.OIDC_PROVIDER_URL }}"
          github_actions_condition = "${{ secrets.ACTIONS_CONDITION }}"
          iam_policies = ${{ secrets.IAM_POLICIES }}
          key_name = ${{ secrets.KEY_NAME }}
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
